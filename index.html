<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner - Timely</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ Weekly Meal Planner</h1>
            <p>Plan your meals for the week and generate shopping lists</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('planner')">📅 Planner</button>
            <button class="tab-btn" onclick="switchTab('recipes')">📖 Recipes</button>
            <button class="tab-btn" onclick="switchTab('shopping')">🛒 Shopping List</button>
        </nav>

        <!-- Planner Tab -->
        <div id="planner-tab" class="tab-content active">
            <div class="planner-controls">
                <button class="btn btn-primary" onclick="clearWeek()">Clear Week</button>
                <button class="btn btn-secondary" onclick="downloadPlan()">Download Plan</button>
            </div>

            <div class="week-grid" id="weekPlanner"></div>
        </div>

        <!-- Recipes Tab -->
        <div id="recipes-tab" class="tab-content">
            <div class="recipes-section">
                <div class="recipe-form">
                    <h2>Add New Recipe</h2>
                    <input type="text" id="recipeName" placeholder="Recipe name" maxlength="50">
                    <textarea id="recipeIngredients" placeholder="Ingredients (one per line)"></textarea>
                    <textarea id="recipeInstructions" placeholder="Instructions"></textarea>
                    <input type="number" id="recipeCalories" placeholder="Calories" min="0" max="10000">
                    <button class="btn btn-primary" onclick="addRecipe()">Save Recipe</button>
                </div>

                <div class="recipes-list">
                    <h2>Your Recipes</h2>
                    <div id="recipesList"></div>
                </div>
            </div>
        </div>

        <!-- Shopping List Tab -->
        <div id="shopping-tab" class="tab-content">
            <div class="shopping-section">
                <div class="shopping-controls">
                    <button class="btn btn-primary" onclick="generateShoppingList()">Generate from Plan</button>
                    <button class="btn btn-secondary" onclick="clearShoppingList()">Clear List</button>
                    <button class="btn btn-secondary" onclick="downloadShoppingList()">Download</button>
                </div>
                <div id="shoppingList"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
